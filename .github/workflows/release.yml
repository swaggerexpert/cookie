name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/@swaggerexpert/cookie

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      # tarball is packed by semantic-release (npm pack), which doesn't run prepublishOnly
      - name: Build code
        run: npm run build

      - name: Execute tests
        run: npm test

      - name: Test artifacts
        run: npm run test:artifacts

      - name: Test typings
        run: npm run test:types

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release

      # semantic-release packs the tarball only when there is a new release
      - name: Detect npm tarball
        id: tarball
        run: |
          if compgen -G "dist/*.tgz" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest npm tarball (GitHub)
        if: steps.tarball.outputs.exists == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tgz"

      - name: Publish tarball to npm (OIDC)
        if: steps.tarball.outputs.exists == 'true'
        run: |
          set -euo pipefail
          TARBALL="$(ls -1 dist/*.tgz | head -n 1)"
          echo "Publishing $TARBALL"
          npm publish "file:./$TARBALL" --provenance
